apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: factory-vscode
  title: factory-vscode
  description: >-
    VS Code (and OpenVSX-compatible IDE) extension that brings the live PARR
    pipeline into the editor — pipeline tree, animated cockpit, live agent
    console, plan/review surfaces, and notifications. Consumes CFactory's REST +
    WebSocket API.
  annotations:
    github.com/project-slug: olafkfreund/factory-vscode
    backstage.io/source-location: url:https://github.com/olafkfreund/factory-vscode/
    # TechDocs is built from the mkdocs.yml in this repo (docs_dir: techdocs).
    backstage.io/techdocs-ref: dir:.
  tags:
    - vscode
    - extension
    - cockpit
    - parr
    - observability
    - typescript
  links:
    - url: https://olafkfreund.github.io/factory-vscode/
      title: Project site and blog
      icon: web
    - url: https://github.com/olafkfreund/factory-vscode
      title: Repository
      icon: github
    - url: https://github.com/olafkfreund/factory-vscode/releases/latest
      title: Latest release
      icon: github
spec:
  type: tool
  lifecycle: production
  owner: olafkfreund
  system: factory-suite
  dependsOn:
    - component:cfactory
