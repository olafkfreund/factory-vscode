name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build webview
        run: npm run build:webview

      - name: Build extension
        run: npm run build:ext

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o factory-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-vscode-vsix
          path: factory-vscode.vsix
