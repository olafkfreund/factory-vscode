name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build webview
        run: npm run build:webview

      - name: Build extension
        run: npm run build:ext

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o factory-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-vscode-vsix
          path: factory-vscode.vsix

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VS Code runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2 libxkbcommon0 libxdamage1

      - name: Install dependencies
        run: npm ci

      - name: Build webview
        run: npm run build:webview

      - name: Build extension
        run: npm run build:ext

      - name: Build e2e tests
        run: npm run build:e2e

      - name: Run e2e smoke (headless)
        run: xvfb-run -a npm run test:e2e
