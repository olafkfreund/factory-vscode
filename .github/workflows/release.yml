name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build webview
        run: npm run build:webview

      - name: Build extension
        run: npm run build:ext

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o factory-vscode.vsix

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --no-dependencies --packagePath factory-vscode.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish factory-vscode.vsix --pat "$OVSX_PAT"

      - name: Attach VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: factory-vscode.vsix
          generate_release_notes: true
